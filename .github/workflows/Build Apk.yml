name: Build CardLink Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Unzip Project Files
        run: unzip -o CardLink_Android_Project-v51.zip

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Decode Permanent Release Keystore
        env:
          CARDLINK_KEYSTORE_BASE64: ${{ secrets.CARDLINK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CARDLINK_KEYSTORE_BASE64" ]; then
            echo "ERROR: CARDLINK_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$CARDLINK_KEYSTORE_BASE64" | base64 --decode > cardlink-release.jks

      - name: 6. Build Signed Release APK
        env:
          CARDLINK_KEYSTORE_PATH: cardlink-release.jks
          CARDLINK_KEYSTORE_PASSWORD: ${{ secrets.CARDLINK_KEYSTORE_PASSWORD }}
          CARDLINK_KEY_ALIAS: ${{ secrets.CARDLINK_KEY_ALIAS }}
          CARDLINK_KEY_PASSWORD: ${{ secrets.CARDLINK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 7. Verify APK Signing Fingerprint
        run: |
          ls -lh app/build/outputs/apk/release/
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk


      - name: 8. Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardLink-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
