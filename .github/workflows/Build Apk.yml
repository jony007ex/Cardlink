name: Build CardLink APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Unzip Project Files
        run: unzip -o CardLink_Android_Project-v17.1.zip

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Generate Keystore & Build Signed Release APK
        run: |
          keytool -genkeypair -v \
            -keystore cardlink-release.jks \
            -alias cardlink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cardlink123 \
            -keypass cardlink123 \
            -dname "CN=CardLink, OU=Mobile, O=CardLink, L=Dhaka, ST=Dhaka, C=BD"
          gradle assembleRelease --no-daemon --stacktrace

      - name: 7. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardLink-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardLink-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
